services:
  app:
    build: .
    container_name: bun-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '8010'
    command: >
      sh -c "
      until bun run src/seeders/roleSeeder.js;
      do echo 'Seeder failed, retrying in 5s...'; sleep 5; done &&
      bun run src/index.js"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done'"
    networks:
      - app-network

  mongodb:
  image: mongo:7
  container_name: mongodb
  restart: unless-stopped
  command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
  ports:
    - '127.0.0.1:27017:27017'
  volumes:
    - mongodb-data:/data/db
  networks:
    - app-network
  healthcheck:
    test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: 'no'
    entrypoint: >
      bash -c "
      echo 'Waiting for MongoDB...' &&
      sleep 5 &&
      mongosh mongodb:27017 --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [{ _id: 0, host: \"mongodb:27017\" }]
        })
      ' || true
      "

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  mongodb-data:
  redis-data:

networks:
  app-network:
    driver: bridge

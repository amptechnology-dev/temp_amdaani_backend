services:
  app:
    build: .
    container_name: bun-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '8010'
    command: >
      sh -c "
      until bun run src/seeders/roleSeeder.js;
      do echo 'Seeder failed, retrying in 5s...'; sleep 5; done &&
      bun run src/index.js"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy   # ← changed from service_started
    networks:
      - app-network

  # ...nginx, certbot unchanged...

  mongodb:
    # ...unchanged, already has healthcheck...

  mongo-init:
    # ...unchanged...

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:                    # ← added
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mongodb-data:
  redis-data:

networks:
  app-network:
    driver: bridge
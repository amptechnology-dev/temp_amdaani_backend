# HTTP — redirect all to HTTPS + serve certbot challenges
server {
    listen 80;
    server_name amdaani.v1.amptechnology.in;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy to bun app
server {
    listen 443 ssl;
    server_name amdaani.v1.amptechnology.in;

    ssl_certificate /etc/letsencrypt/live/amdaani.v1.amptechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amdaani.v1.amptechnology.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api {
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}